schema_version: 3
project:
  slug: bisrepetita
  type: astro
  created_on: 2026-07-28
  updated_on: 2026-07-28

modules:
  project: ready
  business: needs_review
  brand: needs_review
  design: pending
  moodboard: needs_review
  seo: needs_review
  gmb: needs_review
  newsletter: disabled

paths:
  project_context: docs/project
  brand_context: docs/brand
  design_context: docs/design
  seo_context: docs/seo
  channel_context: docs/channels
  visual_runtime: visual

content:
  drafts_dir: content/_drafts/blog
  published_dir: src/content/blog
  article_pattern: "{slug}.{ext}"
  cover_dir: public/images/blog
  cover_pattern: "{slug}.webp"
  localization: monolingual
  default_locale: fr
  default_extension: mdx
  frontmatter:
    published_date: pubDate
    cover: image
    required_fields: ["title", "description", "pubDate", "category", "draft"]
  lint:
    tldr_component: Tldr
    faq_headings: ["## Questions fréquentes", "## FAQ"]
    conclusion_headings: ["## Conclusion", "## Pour finir"]
    sources_headings: ["## Sources et références", "## Sources et Références", "## Sources"]
    final_cta_pattern: '^<ArticleCta\b'
